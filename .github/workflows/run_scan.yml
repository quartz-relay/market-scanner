name: Trade Scan

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Encrypted payload from Claude'
        required: true
        type: string
      run_id:
        description: 'Run identifier (A, B, or C)'
        required: true
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy yfinance cryptography

      - name: Write payload
        run: printf '%s' "${{ inputs.payload }}" > /tmp/scan_payload.json

      - name: Run scan
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
          SHEET_LOG_WEBAPP_URL: ${{ secrets.SHEET_LOG_WEBAPP_URL }}
          SHEET_LOG_SHARED_SECRET: ${{ secrets.SHEET_LOG_SHARED_SECRET }}
          PAYLOAD_ENCRYPTION_KEY: ${{ secrets.PAYLOAD_ENCRYPTION_KEY }}
          TICKER_CONFIG: ${{ vars.TICKER_CONFIG }}
        run: python run_scan.py --input /tmp/scan_payload.json

      - name: Upload payload on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-payload-${{ inputs.run_id }}-${{ github.run_id }}
          path: /tmp/scan_payload.json
          retention-days: 3

      - name: Delete this run log
        if: always()
        run: |
          curl -s -X DELETE \
            -H "Authorization: token ${{ secrets.CLEANUP_PAT }}" \
            "https://api.github.com/repos/quartz-relay/market-scanner/actions/runs/${{ github.run_id }}"
